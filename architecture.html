<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>L.EVER Uploader — Architecture Diagram</title>
<style>body{font-family:sans-serif;background:#fff;margin:24px}h1{font-size:20px}svg{max-width:100%}</style></head>
<body>
<h1>L.EVER Uploader — Architecture Diagram</h1>
<svg width="980" height="430" viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <style>
    .box{fill:#eef4fb;stroke:#3366aa;stroke-width:1.5;rx:8}
    .core{fill:#dcebfb;stroke:#2255aa;stroke-width:2}
    .lbl{font-size:14px;fill:#111}
    .sub{font-size:11.5px;fill:#444}
    .note{font-size:12px;fill:#333}
    line,path.flow{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#arr)}
  </style>

  <!-- Owner -->
  <rect class="box" x="20" y="150" width="150" height="90"/>
  <text class="lbl" x="95" y="185" text-anchor="middle">Channel Owner</text>
  <text class="sub" x="95" y="205" text-anchor="middle">(sole user)</text>
  <text class="sub" x="95" y="221" text-anchor="middle">prepares files</text>

  <!-- Local folders -->
  <rect class="box" x="230" y="150" width="180" height="90"/>
  <text class="lbl" x="320" y="180" text-anchor="middle">Local Folders</text>
  <text class="sub" x="320" y="200" text-anchor="middle">queue/&lt;channel&gt;/</text>
  <text class="sub" x="320" y="216" text-anchor="middle">video file + meta.json</text>

  <!-- Uploader core -->
  <rect class="core" x="480" y="110" width="230" height="170"/>
  <text class="lbl" x="595" y="140" text-anchor="middle">L.EVER Uploader (Python)</text>
  <text class="sub" x="595" y="164" text-anchor="middle">runs on the owner's own Mac</text>
  <text class="sub" x="595" y="188" text-anchor="middle">• Scheduler trigger (launchd)</text>
  <text class="sub" x="595" y="208" text-anchor="middle">• Resumable upload client</text>
  <text class="sub" x="595" y="228" text-anchor="middle">• Metadata / thumbnail setter</text>
  <text class="sub" x="595" y="248" text-anchor="middle">• Archiver + logger</text>

  <!-- Token store -->
  <rect class="box" x="480" y="330" width="230" height="70"/>
  <text class="lbl" x="595" y="358" text-anchor="middle">OAuth Token Store (local file)</text>
  <text class="sub" x="595" y="378" text-anchor="middle">refresh tokens, one per channel</text>

  <!-- YouTube API -->
  <rect class="box" x="780" y="110" width="180" height="80"/>
  <text class="lbl" x="870" y="142" text-anchor="middle">YouTube Data API v3</text>
  <text class="sub" x="870" y="162" text-anchor="middle">videos.insert / thumbnails.set</text>

  <!-- Channels -->
  <rect class="box" x="780" y="240" width="180" height="80"/>
  <text class="lbl" x="870" y="272" text-anchor="middle">Owner's 4 Channels</text>
  <text class="sub" x="870" y="292" text-anchor="middle">owned by the same user</text>

  <path class="flow" d="M170,195 L230,195"/>
  <path class="flow" d="M410,195 L480,195"/>
  <path class="flow" d="M710,150 L780,150"/>
  <path class="flow" d="M870,190 L870,240"/>
  <path class="flow" d="M595,330 L595,282"/>
  <text class="sub" x="605" y="310">OAuth 2.0 (youtube.upload scope)</text>

  <text class="note" x="20" y="40">No external server. No third-party users. No viewer/comment/analytics data is accessed or stored.</text>
  <text class="note" x="20" y="60">The only stored data is the owner's own OAuth refresh tokens, kept in a local file on the owner's computer.</text>
</svg>
</body>
</html>
