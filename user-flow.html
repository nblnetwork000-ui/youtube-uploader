<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>L.EVER Uploader — User Flow Diagram</title>
<style>body{font-family:sans-serif;background:#fff;margin:24px}h1{font-size:20px}svg{max-width:100%}</style></head>
<body>
<h1>L.EVER Uploader — User Flow Diagram</h1>
<svg width="980" height="560" viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <style>
    .box{fill:#eef4fb;stroke:#3366aa;stroke-width:1.5}
    .dec{fill:#fff6dd;stroke:#aa8833;stroke-width:1.5}
    .ok{fill:#e6f6e6;stroke:#3a8a3a;stroke-width:1.5}
    .ng{fill:#fdecec;stroke:#b05050;stroke-width:1.5}
    .lbl{font-size:13.5px;fill:#111}
    .sub{font-size:11.5px;fill:#444}
    path.flow{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#arr)}
  </style>

  <rect class="box" x="330" y="20" width="320" height="56"/>
  <text class="lbl" x="490" y="44" text-anchor="middle">1. Owner prepares a video file + meta.json</text>
  <text class="sub" x="490" y="62" text-anchor="middle">(title, description, tags, publish time, thumbnail)</text>

  <rect class="box" x="330" y="106" width="320" height="50"/>
  <text class="lbl" x="490" y="136" text-anchor="middle">2. Places them in queue/&lt;channel&gt;/</text>

  <rect class="box" x="330" y="186" width="320" height="50"/>
  <text class="lbl" x="490" y="216" text-anchor="middle">3. Uploader runs (scheduled by launchd)</text>

  <polygon class="dec" points="490,266 640,306 490,346 340,306"/>
  <text class="lbl" x="490" y="300" text-anchor="middle">4. Valid token</text>
  <text class="lbl" x="490" y="318" text-anchor="middle">for this channel?</text>

  <rect class="box" x="700" y="276" width="260" height="60"/>
  <text class="lbl" x="830" y="300" text-anchor="middle">One-time OAuth consent</text>
  <text class="sub" x="830" y="318" text-anchor="middle">owner clicks "Allow" in the browser;</text>
  <text class="sub" x="830" y="332" text-anchor="middle">token saved locally</text>

  <rect class="box" x="330" y="376" width="320" height="56"/>
  <text class="lbl" x="490" y="400" text-anchor="middle">5. Resumable upload via videos.insert</text>
  <text class="sub" x="490" y="418" text-anchor="middle">then publishAt / thumbnails.set if specified</text>

  <polygon class="dec" points="490,462 610,497 490,532 370,497"/>
  <text class="lbl" x="490" y="502" text-anchor="middle">6. Success?</text>

  <rect class="ok" x="60" y="466" width="250" height="62"/>
  <text class="lbl" x="185" y="490" text-anchor="middle">Files moved to done/</text>
  <text class="sub" x="185" y="508" text-anchor="middle">video ID + result written to logs/</text>

  <rect class="ng" x="670" y="466" width="250" height="62"/>
  <text class="lbl" x="795" y="490" text-anchor="middle">Files moved to failed/</text>
  <text class="sub" x="795" y="508" text-anchor="middle">error reason written to logs/</text>

  <path class="flow" d="M490,76 L490,106"/>
  <path class="flow" d="M490,156 L490,186"/>
  <path class="flow" d="M490,236 L490,266"/>
  <path class="flow" d="M640,306 L700,306"/>
  <text class="sub" x="652" y="296">No</text>
  <path class="flow" d="M830,336 L830,404 L652,404"/>
  <path class="flow" d="M490,346 L490,376"/>
  <text class="sub" x="500" y="366">Yes</text>
  <path class="flow" d="M490,432 L490,462"/>
  <path class="flow" d="M370,497 L310,497"/>
  <text class="sub" x="330" y="487">Yes</text>
  <path class="flow" d="M610,497 L670,497"/>
  <text class="sub" x="628" y="487">No</text>
</svg>
</body>
</html>
